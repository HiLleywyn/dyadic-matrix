name: Matrix CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DM_TEST_DSN: postgresql://postgres:isolated-ci-only@localhost:5432/postgres
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -e ".[postgres]" pytest pytest-asyncio jsonschema
      - name: Run engine and conformance tests
        run: |
          mkdir -p reports
          python -m pytest -q -p no:cacheprovider --junitxml=reports/engine.xml tests
          for f in examples/*.dm; do
            dm validate "$f" --json > /dev/null
          done
